name: PR277 pinned source readback
on:
  push:
    branches: [validation/ph277-wallet-state-20261004]
    paths: [.github/workflows/ph277-source-readback.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7c45877bd7c849a8b94356c2d692845a7d654c91
          persist-credentials: false
      - name: Retain tracked source and its Git identities without execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ph277-source"
          git archive --format=tar HEAD server/src server/package.json server/package-lock.json server/jest.config.js docs/payout-statements.md package.json package-lock.json > "$RUNNER_TEMP/ph277-source/source.tar"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/ph277-source/source.txt"
          git ls-tree -r HEAD server/src > "$RUNNER_TEMP/ph277-source/blobs.txt"
          sha256sum "$RUNNER_TEMP/ph277-source/source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: ph277-source-7c45877
          path: ${{ runner.temp }}/ph277-source
          retention-days: 7
          if-no-files-found: error
