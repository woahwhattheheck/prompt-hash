name: PH259 focused validation

on:
  push:
    branches:
      - validation/ph259-f8e888e0

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Install server dependencies
        run: npm install --prefix server --ignore-scripts --no-audit --no-fund
      - name: Focused publication admission tests
        run: npx vitest run --config vitest.similarity.config.mjs src/test/publicationReview.test.ts --reporter=dot
      - name: Server TypeScript build
        run: npm run build --prefix server
      - name: Focused frontend typecheck
        shell: bash
        run: |
          cat > tsconfig.ph259.json <<'EOF'
          {
            "extends": "./tsconfig.app.json",
            "compilerOptions": {
              "tsBuildInfoFile": "./node_modules/.tmp/tsconfig.ph259.tsbuildinfo"
            },
            "include": [
              "src/lib/prompts/similarityPublish.ts",
              "src/pages/sell/CreatePromptForm.tsx"
            ]
          }
          EOF
          npx tsc -p tsconfig.ph259.json
