name: PH271 canonical clean install

on:
  push:
    branches: [validation/ph-maintained-bb9d-20261004]
    paths: [.github/workflows/ph-maintained-bb9d-once.yml]

permissions:
  contents: read

jobs:
  clean-install:
    if: github.repository == 'woahwhattheheck/prompt-hash' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CI: 'true'
      HUSKY: '0'
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Check out published lock repair
        uses: actions/checkout@v4
        with:
          ref: f05b7daeead78c0a14198750dd8784bf09774916
          path: ph271
          persist-credentials: false
      - name: Install the committed server lock
        working-directory: ph271
        run: |
          test "$(git rev-parse HEAD)" = f05b7daeead78c0a14198750dd8784bf09774916
          node --version
          npm --version
          npm --prefix server ci --ignore-scripts --no-audit --no-fund
          git diff --exit-code
          printf 'Canonical server npm ci passed at `f05b7daeead78c0a14198750dd8784bf09774916`.\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'The22maintained tests passed on unchanged source blobs in run37189010097 and were not repeated.\n' >> "$GITHUB_STEP_SUMMARY"
