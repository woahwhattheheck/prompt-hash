name: PH271 maintained lifecycle check

on:
  push:
    branches: [validation/ph-maintained-bb9d-20261004]
    paths: [.github/workflows/ph-maintained-bb9d-once.yml]

permissions:
  contents: read

jobs:
  lifecycle:
    if: github.repository == 'woahwhattheheck/prompt-hash' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      HUSKY: '0'
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Check out PH271 source
        uses: actions/checkout@v4
        with:
          ref: 870d17c003a3cd4a6610395c18dceb9dffa1eb4e
          path: ph271
          persist-credentials: false
      - name: Prepare real server dependencies outside the source
        working-directory: ph271
        run: |
          test "$(git rev-parse HEAD)" = 870d17c003a3cd4a6610395c18dceb9dffa1eb4e
          node --version
          npm --version
          # Direct manifest entries match; npm ci found three missing emnapi
          # transitive entries. Complete only a temporary copy of that lock.
          runtime="$RUNNER_TEMP/ph271-maintained-runtime-bb9d"
          mkdir -p "$runtime"
          cp server/package.json server/package-lock.json "$runtime/"
          npm install --prefix "$runtime" --ignore-scripts --no-audit --no-fund
          npm ls --prefix "$runtime" --depth=0
          ln -s "$runtime/node_modules" server/node_modules
          git diff --exit-code
      - name: Run maintained runtime and lifecycle selection
        working-directory: ph271
        run: |
          npm --prefix server run test:server-lifecycle -- --runInBand
          git diff --exit-code
          printf 'PH271 maintained selection passed at `870d17c003a3cd4a6610395c18dceb9dffa1eb4e`.\n' >> "$GITHUB_STEP_SUMMARY"
