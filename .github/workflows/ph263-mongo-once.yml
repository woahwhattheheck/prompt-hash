name: PH263 Mongo acceptance

on:
  push:
    branches:
      - validation/ph263-mongo-2050-20261004
    paths:
      - .github/workflows/ph263-mongo-once.yml

permissions:
  contents: read

jobs:
  mongo:
    if: github.repository == 'woahwhattheheck/prompt-hash' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:7.0.14
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'if (db.adminCommand({ ping: 1 }).ok !== 1) quit(1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AUDIT_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
    steps:
      - name: Check out the published bounty source
        uses: actions/checkout@v4
        with:
          ref: f863e3f33b4d35edd4a91395934c975cd29f58eb
          persist-credentials: false

      - name: Use the recorded Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Run the three Mongo acceptance cases
        shell: bash
        run: |
          set -euo pipefail
          : "${AUDIT_TEST_MONGODB_URI:?Disposable Mongo service URI is required}"
          PH263_RUNTIME="$RUNNER_TEMP/ph263-mongo-runtime"
          mkdir -p "$PH263_RUNTIME"
          printf '{"private":true}\n' > "$PH263_RUNTIME/package.json"
          npm install --prefix "$PH263_RUNTIME" \
            --no-save --no-package-lock --ignore-scripts \
            --no-audit --no-fund --include=optional \
            vitest@4.1.10 mongoose@9.9.2 vite@8.3.2
          ln -s "$PH263_RUNTIME/node_modules" "$GITHUB_WORKSPACE/node_modules"
          node -e 'console.log({ node: process.versions.node, vitest: require("vitest/package.json").version, mongoose: require("mongoose/package.json").version, vite: require("vite/package.json").version })'
          node "$PH263_RUNTIME/node_modules/vitest/vitest.mjs" run \
            --config vitest.durable-audit.config.mjs \
            tests/durableAuditQueue.mongo.test.ts --reporter=verbose
