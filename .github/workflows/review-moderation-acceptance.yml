name: Review moderation acceptance

on:
  push:
    branches:
      - verify/review-hidden-report-20261004

permissions:
  contents: read

jobs:
  mongodb:
    name: MongoDB report and moderation acceptance
    if: github.repository == 'woahwhattheheck/prompt-hash'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASELINE_REF: f871a5d44c4e8d3a665fae73c2cfe2f933ce056c
      CANDIDATE_REF: 5d42259ff0465e4f6178fb67739c0451877fd46d
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out isolated acceptance revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize and verify exact source revisions
        shell: bash
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/review-moderation-before"
          mkdir -p "$before" acceptance-results
          git cat-file -e "$BASELINE_REF^{commit}"
          git cat-file -e "$CANDIDATE_REF^{commit}"
          for source in \
            src/lib/reviews/fileReviewRepository.ts \
            src/lib/reviews/mongoReviewRepository.ts \
            src/lib/reviews/pathLock.ts \
            src/lib/reviews/reviewStore.ts \
            src/lib/reviews/reviewTypes.ts \
            server/src/models/Review.ts; do
            test "$(git hash-object "$source")" = "$(git rev-parse "$CANDIDATE_REF:$source")"
            mkdir -p "$before/$(dirname "$source")"
            git show "$BASELINE_REF:$source" > "$before/$source"
          done
          git show "$BASELINE_REF:package.json" > "$before/package.json"
          printf 'REVIEW_BASELINE_DIRECTORY=%s\n' "$before" >> "$GITHUB_ENV"
      - name: Install only the production MongoDB adapter dependency
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/review-moderation-runtime"
          mkdir -p "$runtime"
          printf '{"private":true,"type":"module"}\n' > "$runtime/package.json"
          npm install --prefix "$runtime" --ignore-scripts --no-audit --no-fund --no-package-lock --save-exact mongoose@9.10.4
          ln -s "$runtime/node_modules" node_modules
          ln -s "$runtime/node_modules" "$REVIEW_BASELINE_DIRECTORY/node_modules"
          npm ls --prefix "$runtime" --all --json > acceptance-results/runtime-dependencies.json
      - name: Compare baseline and candidate against real MongoDB
        run: >-
          node --import ./scripts/register-review-typescript.mjs
          ./scripts/review-moderation-mongo-acceptance.mjs
          "$REVIEW_BASELINE_DIRECTORY" "$GITHUB_WORKSPACE"
          acceptance-results/review-moderation.json
      - name: Retain concise source and database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-moderation-acceptance
          path: acceptance-results/
          if-no-files-found: error
          retention-days: 7
